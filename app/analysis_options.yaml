include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "lib/generated/**"
    - build/**
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Production code must not ship TODOs without a tracking owner.
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_unnecessary_containers
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unawaited_futures
    - use_named_constants
